<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tham gia phòng — Cast Screen Pro</title><link rel="stylesheet" href="css/style.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#050914}.card{width:min(500px,92vw);padding:30px;border-radius:24px;background:rgba(11,18,32,.94);border:1px solid rgba(148,163,184,.16);text-align:center}.back{display:inline-block;color:#94a3b8;text-decoration:none;margin-bottom:22px}.input{width:100%;box-sizing:border-box;padding:16px;border-radius:14px;background:#08111f;border:1px solid rgba(148,163,184,.2);color:#fff;text-align:center;font-size:24px;letter-spacing:7px;font-weight:900}.btn{width:100%;margin-top:14px;border:0;border-radius:14px;padding:15px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#00e5ff,#2578ff)}.hint{color:#94a3b8;font-size:13px;line-height:1.5}.error{color:#fda4af;min-height:20px;margin-top:12px}</style></head><body><main class="card"><a class="back" href="home.html">← Trang chủ</a><h1>Tham gia phòng</h1><p class="hint">Nhập mã phòng gồm 6 số. Bạn sẽ được chuyển vào phòng sau khi bấm nút.</p><input id="code" class="input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><button id="join" class="btn primary">VÀO PHÒNG</button><div id="error" class="error"></div></main><script>const code=document.getElementById('code');const join=document.getElementById('join');const error=document.getElementById('error');code.addEventListener('input',()=>{code.value=code.value.replace(/\D/g,'').slice(0,6);error.textContent=''});join.onclick=()=>{if(code.value.length!==6){error.textContent='Mã phòng phải có 6 số.';return}location.href='room.html?room='+encodeURIComponent(code.value)};code.addEventListener('keydown',e=>{if(e.key==='Enter')join.click()});</script></body></html>
