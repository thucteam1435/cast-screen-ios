<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo phòng — Cast Screen Pro</title><link rel="stylesheet" href="css/style.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#050914}.card{width:min(560px,92vw);padding:30px;border-radius:24px;background:rgba(11,18,32,.94);border:1px solid rgba(0,229,255,.18);text-align:center}.back{display:inline-block;color:#94a3b8;text-decoration:none;margin-bottom:22px}.code{font-size:46px;font-weight:900;letter-spacing:10px;margin:20px 0}.qr{display:flex;justify-content:center;margin:16px 0}.link{display:flex;gap:8px}.link input{flex:1;padding:12px;border-radius:12px;background:#08111f;border:1px solid rgba(148,163,184,.2);color:#fff}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#00e5ff,#2578ff)}.leave{margin-top:20px;background:#f43f5e;color:#fff}.hint{color:#94a3b8;font-size:13px;line-height:1.5}</style></head><body><main class="card"><a class="back" href="home.html">← Trang chủ</a><h1>Phòng của bạn</h1><p class="hint">Mã phòng được tạo một lần và giữ nguyên cho đến khi bạn thoát.</p><div class="code" id="code">------</div><div class="qr"><div id="qr"></div></div><div class="link"><input id="link" readonly><button class="btn primary" id="copy">Copy</button></div><p class="hint">Thiết bị thứ hai mở link hoặc nhập mã này để tham gia. Phòng tối đa 2 thiết bị.</p><button class="btn leave" id="leave">Thoát phòng</button></main><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="js/webrtc_manager.js?v=3.8"></script><script>const code=Math.floor(100000+Math.random()*900000).toString();const roomUrl=new URL('room.html',location.href);roomUrl.searchParams.set('host',code);document.getElementById('code').textContent=code;document.getElementById('link').value=roomUrl.href;new QRCode(document.getElementById('qr'),{text:roomUrl.href,width:180,height:180,correctLevel:QRCode.CorrectLevel.M});document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(roomUrl.href);document.getElementById('copy').textContent='Đã copy';setTimeout(()=>document.getElementById('copy').textContent='Copy',1200)};document.getElementById('leave').onclick=()=>location.href='home.html';</script></body></html>
