<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Cast Screen Pro — LAN Mode</title>
    <script>
        (function () {
            const p = new URLSearchParams(location.search);
            const room = p.get('room');
            const mode = p.get('mode');
            const target = new URL('peer.html', location.href);
            if (room) target.searchParams.set('room', room);
            if (mode === 'host' || mode === 'client') target.searchParams.set('mode', mode);
            location.replace(target.href);
        })();
    </script>
</head>
<body style="background:#020617;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh">
    <div>Đang mở Cast Screen LAN…</div>
</body>
</html>
